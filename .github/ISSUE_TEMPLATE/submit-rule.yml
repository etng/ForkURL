name: 📝 提交规则
description: 为 ForkURL 提交一条新规则（添加到现有组或新建组）。审核通过后将自动合并到 rules.json。
title: "[规则] "
labels: ["rule-submission"]
body:
  - type: markdown
    attributes:
      value: |
        感谢贡献规则！**最简单的方式**是在扩展设置页里用可视化编辑器编好，点规则旁的「📤 提交到官方源」按钮，下面所有字段会自动填好。

        手动填写也 OK，注意：
        - URL 模板里 `{1}`、`{2}` 引用 `patterns` 中正则的捕获组
        - 图标可填 `simple:github` / `lucide:globe` 或任意 emoji
        - 提交后机器人会自动校验，仓库维护者评论 `/approve` 后自动写入 `rules.json`

  - type: input
    id: group_id
    attributes:
      label: 目标组 ID
      description: 现有组 (`github` / `npm` / `gitlab`) 或新组 ID（小写、`-` 分隔）
      placeholder: github
    validations:
      required: true

  - type: input
    id: group_name
    attributes:
      label: 目标组显示名（新建组时必填）
      description: 仅当 group_id 是新组时填写
      placeholder: GitHub

  - type: input
    id: rule_id
    attributes:
      label: 规则 ID
      description: 在该组内唯一，小写 + `-` 分隔
      placeholder: github-actions
    validations:
      required: true

  - type: input
    id: rule_name
    attributes:
      label: 规则显示名
      placeholder: GitHub Actions 页面
    validations:
      required: true

  - type: textarea
    id: patterns
    attributes:
      label: 匹配正则（一行一个）
      description: 命中任一即匹配。注意转义反斜杠（`\\.` 而非 `\.`）。
      placeholder: |
        ^https://github\.com/([^/]+)/([^/]+)/actions.*
      render: text
    validations:
      required: true

  - type: textarea
    id: links
    attributes:
      label: 链接列表（一行一条，`|` 分隔）
      description: |
        每行一个链接，字段顺序：`显示名 | 图标 | URL 模板 | 说明（可选）`。
        URL 模板里 `{1}` `{2}` 引用上面的捕获组。
        图标支持 `simple:xxx` / `lucide:xxx` / 任意 emoji。
        （也兼容 JSON 数组格式。）
      placeholder: |
        Actions | lucide:zap | https://github.com/{1}/{2}/actions | 查看 GitHub Actions 工作流
        Workflows YAML | lucide:file-code | https://github.com/{1}/{2}/tree/main/.github/workflows |
      render: text
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 补充说明（可选）
      description: 这条规则的用途、典型场景、参考资料
