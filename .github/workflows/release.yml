name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并发布的版本号 tag (e.g. v2.1.0)，会校验 manifest.json'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Build zip
        run: bash scripts/build-extension.sh --check-version "${{ steps.tag.outputs.tag }}"

      - name: Compute checksum
        id: hash
        run: |
          ZIP="dist/forkurl-${{ steps.tag.outputs.tag }}.zip"
          SHA=$(shasum -a 256 "$ZIP" | awk '{print $1}')
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "zip=$ZIP" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ steps.hash.outputs.sha }}
        run: |
          cat > /tmp/notes.md <<EOF
          ## ForkURL ${TAG}

          ### 安装

          1. 下载 [\`forkurl-${TAG}.zip\`](#assets) 并解压
          2. 打开 \`chrome://extensions\` → 开启「开发者模式」
          3. 点「加载已解压的扩展程序」选择解压后的目录

          ### 校验

          \`\`\`
          SHA-256: ${SHA}
          \`\`\`

          ### 自上一版以来的提交

          $(git log --pretty=format:'- %s' $(git describe --tags --abbrev=0 ${TAG}^ 2>/dev/null || echo HEAD)..${TAG} 2>/dev/null || git log --pretty=format:'- %s' -n 20)
          EOF
          echo "path=/tmp/notes.md" >> $GITHUB_OUTPUT

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            "${{ steps.hash.outputs.zip }}" \
            --title "ForkURL ${{ steps.tag.outputs.tag }}" \
            --notes-file "${{ steps.notes.outputs.path }}"
