<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>ForkURL site asset fixture</title>
		<style>
			:root {
				color-scheme: light;
				--ink: #24292f;
				--muted: #57606a;
				--paper: #f6f8fa;
				--surface: #ffffff;
				--line: #d0d7de;
				--route: #0969da;
				--route-deep: #0550ae;
				--signal: #2da44e;
				--sky: #54aeff;
				--violet: #8250df;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: #eef5ff;
			}

			.shot {
				width: 960px;
				height: 600px;
				border: 1px solid var(--line);
				border-radius: 12px;
				overflow: hidden;
				background:
					linear-gradient(90deg, rgba(9, 105, 218, 0.05) 0 1px, transparent 1px 80px),
					var(--paper);
				box-shadow: 0 24px 80px rgba(36, 41, 47, 0.18);
				position: relative;
			}

			.browser-bar {
				height: 54px;
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 0 18px;
				border-bottom: 1px solid var(--line);
				background: var(--surface);
			}

			.dot {
				width: 10px;
				height: 10px;
				border-radius: 50%;
				background: var(--signal);
			}

			.dot:nth-child(2) {
				background: #bf8700;
			}

			.dot:nth-child(3) {
				background: var(--route);
			}

			.address {
				flex: 1;
				min-height: 30px;
				display: flex;
				align-items: center;
				padding: 0 12px;
				border: 1px solid var(--line);
				border-radius: 8px;
				background: #f6f8fa;
				color: var(--muted);
				font-size: 13px;
			}

			.page {
				height: calc(100% - 54px);
				display: grid;
				grid-template-columns: 1fr 318px;
				gap: 24px;
				padding: 34px;
			}

			.repo {
				display: grid;
				align-content: start;
				gap: 18px;
				color: var(--ink);
			}

			.path {
				color: var(--muted);
				font-size: 16px;
			}

			.title {
				font-size: 34px;
				font-weight: 760;
				line-height: 1.1;
			}

			.description {
				max-width: 500px;
				color: var(--muted);
				font-size: 16px;
				line-height: 1.6;
			}

			.rows {
				display: grid;
				gap: 10px;
				margin-top: 8px;
			}

			.row {
				height: 42px;
				border: 1px solid var(--line);
				border-radius: 8px;
				background: var(--surface);
			}

			.popup {
				width: 280px;
				justify-self: end;
				align-self: start;
				border: 1px solid var(--line);
				border-radius: 8px;
				background: white;
				box-shadow: 0 18px 50px rgba(36, 41, 47, 0.18);
				overflow: hidden;
			}

			.popup-header {
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 10px 14px;
				border-bottom: 1px solid #d0d7de;
				color: #24292f;
				font-size: 13px;
				font-weight: 600;
			}

			.popup-brand {
				display: flex;
				align-items: center;
				gap: 6px;
			}

			.popup-mark {
				width: 18px;
				height: 18px;
				border-radius: 4px;
			}

			.settings {
				color: #57606a;
				font-size: 11px;
				font-weight: 400;
			}

			.group-label {
				padding: 8px 14px 2px;
				color: #57606a;
				font-size: 10px;
				font-weight: 700;
				letter-spacing: 0.06em;
				text-transform: uppercase;
			}

			.shortcut {
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 8px 14px;
				color: #24292f;
				font-size: 13px;
			}

			.shortcut:nth-of-type(4n + 1) {
				background: #f6f8fa;
				color: #0969da;
			}

			.shortcut-icon {
				width: 18px;
				display: inline-flex;
				justify-content: center;
				color: var(--route);
			}

			.badge {
				position: absolute;
				right: 364px;
				top: 68px;
				display: inline-grid;
				place-items: center;
				min-width: 30px;
				height: 22px;
				border-radius: 999px;
				background: var(--route);
				color: white;
				font-size: 12px;
				font-weight: 760;
			}
		</style>
	</head>
	<body>
		<div class="shot">
			<div class="browser-bar">
				<span class="dot"></span>
				<span class="dot"></span>
				<span class="dot"></span>
				<div class="address">https://github.com/etng/ForkURL</div>
			</div>
			<div class="badge">10</div>
			<div class="page">
				<div class="repo">
					<div class="path">etng /</div>
					<div class="title">ForkURL</div>
					<div class="description">Chrome 扩展：在 GitHub、npm、GitLab 页面一键跳转 Pages、Raw、IDE、CDN 和分析工具。</div>
					<div class="rows">
						<div class="row"></div>
						<div class="row"></div>
						<div class="row"></div>
						<div class="row"></div>
					</div>
				</div>
				<div class="popup">
					<div class="popup-header">
						<span class="popup-brand"><img class="popup-mark" src="../../site/assets/favicon.png" alt="">ForkURL</span>
						<span class="settings">设置</span>
					</div>
					<div class="group-label">GitHub</div>
					<div class="shortcut"><span class="shortcut-icon">⌁</span><span>Pages</span></div>
					<div class="shortcut"><span class="shortcut-icon">⌘</span><span>github.dev</span></div>
					<div class="shortcut"><span class="shortcut-icon">⌕</span><span>github1s</span></div>
					<div class="shortcut"><span class="shortcut-icon">◆</span><span>vscode.dev</span></div>
					<div class="shortcut"><span class="shortcut-icon">▣</span><span>Gitpod</span></div>
					<div class="shortcut"><span class="shortcut-icon">◇</span><span>StackBlitz</span></div>
					<div class="shortcut"><span class="shortcut-icon">◈</span><span>CodeSandbox</span></div>
					<div class="shortcut"><span class="shortcut-icon">◎</span><span>pkg-size</span></div>
					<div class="shortcut"><span class="shortcut-icon">○</span><span>jsDelivr GH</span></div>
					<div class="shortcut"><span class="shortcut-icon">⇩</span><span>Releases</span></div>
				</div>
			</div>
		</div>
	</body>
</html>
