<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>URL Switcher</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 280px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    background: #ffffff;
    color: #24292f;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid #d0d7de;
  }
  .header h1 { font-size: 13px; font-weight: 600; }
  .header a {
    font-size: 11px;
    color: #57606a;
    text-decoration: none;
    cursor: pointer;
  }
  .header a:hover { color: #0969da; }
  .list { padding: 6px 0; max-height: 420px; overflow-y: auto; }
  .group-label {
    padding: 8px 14px 2px;
    font-size: 10px;
    font-weight: 600;
    color: #57606a;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px;
    text-decoration: none;
    color: #24292f;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { background: #f6f8fa; color: #0969da; }
  .icon { font-size: 14px; width: 18px; text-align: center; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; }
  .icon svg { width: 14px; height: 14px; }
  .label { font-weight: 500; flex: 1; }
  .desc { font-size: 11px; color: #57606a; }
  .empty {
    padding: 28px 14px;
    text-align: center;
    color: #57606a;
    font-size: 12px;
    line-height: 1.6;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #161b22; color: #c9d1d9; }
    .header, .group-label { border-color: #30363d; color: #8b949e; }
    .btn { color: #c9d1d9; }
    .btn:hover { background: #21262d; color: #58a6ff; }
    .desc, .empty, .header a { color: #8b949e; }
  }
</style>
</head>
<body>
  <div class="header">
    <h1>🔱 ForkURL</h1>
    <a id="open-options">设置</a>
  </div>
  <div id="content" class="list"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
